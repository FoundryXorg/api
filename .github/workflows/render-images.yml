name: Render font images

on:
  push:
    paths: ['fonts/**']
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: render-images
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfribidi0 libharfbuzz0b fonts-dejavu-core
          pip install --quiet pillow
      - name: Render missing images
        env:
          SCRIPT_URL: ${{ secrets.SCRIPT_URL }}
        run: python scripts/render.py render
      - name: Commit images
        run: |
          git config user.name "font-foundry-bot"
          git config user.email "bot@users.noreply.github.com"
          git add previews pins scripts/failed.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Add font images"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs -q && git push && break
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
          fi
      - name: Tell the sheet
        env:
          SCRIPT_URL: ${{ secrets.SCRIPT_URL }}
          AUTOMATION_KEY: ${{ secrets.AUTOMATION_KEY }}
        run: python scripts/render.py mark
